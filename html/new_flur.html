<DOCTYPE html>
<html>
    <head>
        <title>Flur</title>
                <!-- 1. Vollbildmodus (Macht die Webseite   zur App ohne Safari-Suchleiste) -->
        <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- 2. Name auf dem Home-Bildschirm (Überschreibt den Standardnamen) -->
        <meta name="apple-mobile-web-app-title" content="Schul Simulant">

    <!-- 3. Design der Statusleiste oben (iOS-Uhrzeit und Akku-Anzeige) -->
    <!-- Optionen: "default" (weiß), "black" (schwarz) oder "black-transluce(transparent/schwebend) --> 
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Canvas auf volle Fenstergröße setzen
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// Spieler-Eigenschaften
const player = {
    x: canvas.width / 2,
    y: canvas.height - 150,
    size: 40,
    color: "#ff3333",
    velocityX: 0,
    velocityY: 0,
    speed: 6,
    jumpForce: -15,
    isGrounded: false
};

// Kamera-System für Scrolling
const camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height,
    worldWidth: 3000, // Weltgröße (kann größer sein als Canvas)
    worldHeight: canvas.height
};

// Umwelt-Eigenschaften
const gravity = 0.8;
const floorY = canvas.height - 50;

// Türen (Interaktive Objekte mit Links)
const doors = [
    { x: 400, y: floorY - 100, width: 80, height: 100, color: "#8b4513", link: "room1.html", label: "Raum 1" },
    { x: 1200, y: floorY - 100, width: 80, height: 100, color: "#8b4513", link: "room2.html", label: "Raum 2" },
    { x: 2300, y: floorY - 100, width: 80, height: 100, color: "#8b4513", link: "room3.html", label: "Raum 3" }
];

// Touch/Klick-Steuerung Variablen
let touchStartTime = 0;
let isHolding = false;
let holdDirection = ""; // "left" oder "right"
const CLICK_THRESHOLD = 200; // Millisekunden für einen "kurzen Klick"

// Event Listener für Klicks/Touches
window.addEventListener("mousedown", handleStart);
window.addEventListener("mouseup", handleEnd);
window.addEventListener("click", handleClick);
window.addEventListener("touchstart", (e) => { e.preventDefault(); handleStart(e.touches[0]); }, { passive: false });
window.addEventListener("touchend", (e) => { e.preventDefault(); handleEnd(); handleClickTouch(e); }, { passive: false });

function handleStart(e) {
    touchStartTime = Date.now();
    isHolding = true;

    // Klick-Position im Canvas bestimmen
    const rect = canvas.getBoundingClientRect();
    const clickX = ((e.clientX - rect.left) / rect.width) * canvas.width;

    const canvasThird = canvas.width / 3;

    if (clickX < canvasThird) {
        holdDirection = "left";
    } else if (clickX > canvasThird * 2) {
        holdDirection = "right";
    } else {
        holdDirection = "middle";
    }
}

function handleEnd() {
    const touchDuration = Date.now() - touchStartTime;
    isHolding = false;

    // Wenn der Klick kurz war, springt die Figur (egal wo geklickt wurde)
    if (touchDuration < CLICK_THRESHOLD) {
        if (player.isGrounded) {
            player.velocityY = player.jumpForce;
            player.isGrounded = false;
        }
    }
    
    holdDirection = "";
}

function handleClick(e) {
    checkDoorClick(e);
}

function handleClickTouch(e) {
    // Für Touch-Events: nutze den letzten Touch-Punkt
    if (e.changedTouches && e.changedTouches.length > 0) {
        checkDoorClick(e.changedTouches[0]);
    }
}

function checkDoorClick(e) {
    // Konvertiere Klick-Position zu Welt-Koordinaten
    const rect = canvas.getBoundingClientRect();
    const clickCanvasX = ((e.clientX - rect.left) / rect.width) * canvas.width;
    const clickCanvasY = ((e.clientY - rect.top) / rect.height) * canvas.height;
    
    const worldClickX = clickCanvasX + camera.x;
    const worldClickY = clickCanvasY + camera.y;

    // Überprüfe, ob eine Tür geklickt wurde
    for (let door of doors) {
        if (worldClickX >= door.x && worldClickX <= door.x + door.width &&
            worldClickY >= door.y && worldClickY <= door.y + door.height) {
            window.location.href = door.link;
            return;
        }
    }
}

// Tastatur-Support als Backup
const keys = {};
window.addEventListener("keydown", (e) => keys[e.code] = true);
window.addEventListener("keyup", (e) => keys[e.code] = false);

// Kamera aktualisieren (Scrolling-System)
function updateCamera() {
    // Spieler-Bildschirmposition (Mittelpunkt des Spielers)
    const playerCenter = player.x + player.size / 2;
    const playerScreenX = playerCenter - camera.x;
    const screenThird = canvas.width / 3;

    // Wenn der Spieler den linken Drittel verlässt, scrolle die Kamera
    if (playerScreenX < screenThird && camera.x > 0) {
        camera.x = Math.max(0, playerCenter - screenThird);
    }
    // Wenn der Spieler den rechten Drittel verlässt, scrolle die Kamera
    else if (playerScreenX > screenThird * 2 && camera.x < camera.worldWidth - canvas.width) {
        camera.x = Math.min(camera.worldWidth - canvas.width, playerCenter - screenThird * 2);
    }
}

// Game Loop
function update() {
    // 1. Bewegung verarbeiten (Maus/Touch)
    if (isHolding && (Date.now() - touchStartTime) >= CLICK_THRESHOLD) {
        if (holdDirection === "left") {
            player.velocityX = -player.speed;
        } else if (holdDirection === "right") {
            player.velocityX = player.speed;
        }
    } else {
        player.velocityX = 0;
    }

    // Backup: Tastatur-Steuerung (Pfeiltasten oder WASD)
    if (keys["ArrowLeft"] || keys["KeyA"]) player.velocityX = -player.speed;
    if (keys["ArrowRight"] || keys["KeyD"]) player.velocityX = player.speed;
    if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.isGrounded) {
        player.velocityY = player.jumpForce;
        player.isGrounded = false;
    }

    // 2. Schwerkraft anwenden
    player.velocityY += gravity;

    // 3. Positionen updaten
    player.x += player.velocityX;
    player.y += player.velocityY;

    // 4. Kollision mit dem Boden
    if (player.y + player.size >= floorY) {
        player.y = floorY - player.size;
        player.velocityY = 0;
        player.isGrounded = true;
    }

    // 5. Grenzen des Spielfelds (links/rechts in der Welt)
    if (player.x < 0) player.x = 0;
    if (player.x + player.size > camera.worldWidth) player.x = camera.worldWidth - player.size;

    // 6. Kamera aktualisieren
    updateCamera();

    // 7. Zeichnen
    draw();

    requestAnimationFrame(update);
}

function draw() {
    // Canvas leeren
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Hintergrund (Himmel)
    ctx.fillStyle = "#e0f7fa";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Drittel-Zonen zur Orientierung leicht einzeichnen
    ctx.fillStyle = "rgba(0, 0, 0, 0.03)";
    ctx.fillRect(0, 0, canvas.width / 3, canvas.height);
    ctx.fillRect((canvas.width / 3) * 2, 0, canvas.width / 3, canvas.height);

    // Boden zeichnen
    ctx.fillStyle = "#8d6e63";
    ctx.fillRect(-camera.x, floorY, camera.worldWidth, canvas.height - floorY);
    ctx.fillStyle = "#4caf50"; // Graslinie
    ctx.fillRect(-camera.x, floorY, camera.worldWidth, 10);

    // Türen zeichnen
    for (let door of doors) {
        const screenX = door.x - camera.x;
        const screenY = door.y - camera.y;

        // Nur zeichnen, wenn im Sichtbereich
        if (screenX + door.width > 0 && screenX < canvas.width) {
            ctx.fillStyle = door.color;
            ctx.fillRect(screenX, screenY, door.width, door.height);

            // Türrahmen (dunkler Rand)
            ctx.strokeStyle = "#654321";
            ctx.lineWidth = 3;
            ctx.strokeRect(screenX, screenY, door.width, door.height);

            // Türknauf
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.arc(screenX + door.width - 15, screenY + door.height / 2, 8, 0, Math.PI * 2);
            ctx.fill();

            // Label
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(door.label, screenX + door.width / 2, screenY + door.height + 20);
        }
    }

    // Spieler (Rotes Quadrat) zeichnen
    const playerScreenX = player.x - camera.x;
    const playerScreenY = player.y - camera.y;

    ctx.fillStyle = player.color;
    ctx.fillRect(playerScreenX, playerScreenY, player.size, player.size);
    
    // Schwarzer Rand für den Spieler
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.strokeRect(playerScreenX, playerScreenY, player.size, player.size);

    // Steuerungs-Hinweistext
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("<- Halten: Links", canvas.width / 6, 30);
    ctx.fillText("Kurzer Klick: Springen", canvas.width / 2, 30);
    ctx.fillText("Halten: Rechts ->", (canvas.width / 6) * 5, 30);

    // Level-Fortschritt anzeigen
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "left";
    const progress = Math.round((player.x / camera.worldWidth) * 100);
    ctx.fillText(`Fortschritt: ${progress}%`, 10, canvas.height - 10);
}

// Spiel starten
update();
</script>

</body>
</html>
